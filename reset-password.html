<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重置密码 - AI学社</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/assets/main.css" />
  <link rel="stylesheet" href="/assets/components.css" />
</head>
<body data-page="reset-password.html">
  <main id="main-content">
    <section class="reset-password-section">
      <div class="container" style="max-width:440px;padding-top:80px;padding-bottom:80px;">
        <div class="reset-password-card">
          <div id="resetLoading" style="text-align:center;padding:40px 16px;">
            <div class="spinner" style="width:32px;height:32px;border:3px solid var(--color-border);border-top-color:var(--color-primary,#6B8AFF);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;"></div>
            <p style="color:var(--color-muted);">正在验证链接...</p>
          </div>

          <div id="resetError" style="display:none;text-align:center;padding:40px 16px;">
            <div style="font-size:48px;margin-bottom:16px;">❌</div>
            <h2 style="margin-bottom:8px;">链接已失效</h2>
            <p id="resetErrorMsg" style="color:var(--color-muted);margin-bottom:20px;"></p>
            <a href="index.html" class="btn-primary" style="display:inline-block;text-decoration:none;">返回首页</a>
          </div>

          <div id="resetForm" style="display:none;">
            <div class="form-header">
              <h2 class="form-title">设置新密码</h2>
            </div>
            <form id="resetPasswordForm" novalidate style="padding:24px;">
              <div class="form-field">
                <label for="newPassword" class="form-label">新密码</label>
                <input id="newPassword" name="newPassword" type="password" class="form-input"
                  placeholder="至少8位，包含字母和数字" autocomplete="new-password" required>
                <span class="form-error" id="error-password" role="alert"></span>
              </div>
              <div class="form-field">
                <label for="confirmPassword" class="form-label">确认密码</label>
                <input id="confirmPassword" name="confirmPassword" type="password" class="form-input"
                  placeholder="再次输入新密码" autocomplete="new-password" required>
                <span class="form-error" id="error-confirm" role="alert"></span>
              </div>
              <button type="submit" class="btn-primary" id="resetSubmitBtn" style="width:100%;margin-top:16px;">
                重置密码
              </button>
            </form>

            <div id="resetSuccess" style="display:none;text-align:center;padding:24px;">
              <div style="font-size:48px;margin-bottom:16px;">✅</div>
              <h2 style="margin-bottom:12px;">密码重置成功！</h2>
              <p style="color:var(--color-muted);margin-bottom:20px;">3秒后自动跳转首页...</p>
              <a href="index.html" class="btn-primary" style="display:inline-block;text-decoration:none;">前往首页</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
