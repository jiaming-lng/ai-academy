<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <title>页面未找到 - AI学社</title>
  <meta name="description" content="抱歉，您访问的页面不存在。返回AI学社首页继续学习。">
  <meta name="robots" content="noindex, follow">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 60vh;
      padding: var(--space-48) var(--space-24);
    }
    .not-found__code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      line-height: 1;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--space-16);
    }
    .not-found__title {
      font-size: var(--text-2xl);
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: var(--space-8);
    }
    .not-found__desc {
      font-size: var(--text-lg);
      color: var(--color-text-soft);
      margin-bottom: var(--space-32);
      max-width: 480px;
    }
    .not-found__actions {
      display: flex;
      gap: var(--space-12);
      flex-wrap: wrap;
      justify-content: center;
    }
    .not-found__graphic {
      margin-bottom: var(--space-32);
      opacity: 0.6;
    }
    .not-found__graphic svg {
      width: 120px;
      height: 120px;
    }
  </style>
</head>
<body data-page="404.html" data-cta-text="返回首页" data-cta-href="index.html">

  <main id="main-content" tabindex="-1">

    <section class="not-found">
      <div class="not-found__graphic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>

      <div class="not-found__code" aria-hidden="true">404</div>
      <h1 class="not-found__title">页面未找到</h1>
      <p class="not-found__desc">
        抱歉，您访问的页面不存在或已被移动。请检查网址是否正确，或者返回首页继续探索 AI 学习之旅。
      </p>

      <div class="not-found__actions">
        <a href="index.html" class="btn btn-primary">
          <span data-icon="home" data-icon-color="currentColor" style="display:inline-flex;width:20px;height:20px;margin-right:8px;vertical-align:middle;"></span>
          返回首页
        </a>
        <a href="courses.html" class="btn btn-secondary">浏览课程</a>
      </div>
    </section>

  </main>

  <script type="module" src="js/icons.js"></script>
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/toast.js"></script>
  <script type="module" src="js/forms.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
